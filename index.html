<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=DM+Sans:wght@300;400;500&display=swap');

  *{
    box-sizing:border-box;
    margin:0;
    padding:0;
  }

  body{
    overflow-x:hidden;
  }

  .s{
    font-family:'DM Sans',sans-serif;
    color:var(--color-text-primary);
    background:var(--color-background-primary);
    width:100%;
  }

  .nav{
    width:100%;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:1.5rem 6vw;
    border-bottom:0.5px solid var(--color-border-tertiary);
    background:rgba(255,255,255,0.96);
    position:sticky;
    top:0;
    z-index:50;
    backdrop-filter:blur(10px);
  }

  .logo{
    font-family:'Playfair Display',serif;
    font-size:28px;
    font-weight:500;
  }

  .logo span{
    color:#1D9E75;
  }

  .nav-links{
    display:flex;
    gap:32px;
    list-style:none;
  }

  .nav-links a{
    font-size:15px;
    color:var(--color-text-secondary);
    text-decoration:none;
    transition:0.2s;
  }

  .nav-links a:hover{
    color:#1D9E75;
  }

  .hero{
    position:relative;
    width:100%;
    min-height:92vh;
    overflow:hidden;
    background:#000;
  }

  .hero-img{
    width:100%;
    height:92vh;
    object-fit:cover;
    display:block;
    opacity:0.38;
    transform:scale(1.03);
  }

  .hero-content{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    justify-content:center;
    padding:0 8vw;
    max-width:1400px;
  }

  .eyebrow{
    font-size:12px;
    font-weight:500;
    letter-spacing:0.16em;
    text-transform:uppercase;
    color:#5DCAA5;
    margin-bottom:1.2rem;
  }

  .slide h1{
    font-family:'Playfair Display',serif;
    font-size:clamp(42px,6vw,78px);
    font-weight:400;
    line-height:1.08;
    color:#fff;
    margin-bottom:1.5rem;
    max-width:900px;
  }

  .slide p{
    font-size:20px;
    line-height:1.8;
    color:rgba(255,255,255,0.78);
    max-width:720px;
    margin-bottom:2rem;
    font-weight:300;
  }

  .hero-cta{
    display:inline-flex;
    align-items:center;
    gap:8px;
    background:#1D9E75;
    color:#fff;
    padding:16px 34px;
    border-radius:8px;
    font-size:16px;
    font-weight:500;
    border:none;
    cursor:pointer;
    transition:0.25s;
  }

  .hero-cta:hover{
    transform:translateY(-2px);
    background:#178764;
  }

  .dots{
    display:flex;
    gap:10px;
    margin-top:2rem;
  }

  .dot{
    width:10px;
    height:10px;
    border-radius:50%;
    background:rgba(255,255,255,0.28);
    border:none;
    cursor:pointer;
  }

  .dot.active{
    background:#1D9E75;
  }

  .sec{
    width:100%;
    padding:7rem 8vw;
  }

  .sec-label{
    font-size:12px;
    font-weight:500;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--color-text-secondary);
    margin-bottom:1.4rem;
  }

  .sec h2{
    font-family:'Playfair Display',serif;
    font-size:clamp(36px,4vw,58px);
    font-weight:400;
    line-height:1.15;
    margin-bottom:1.5rem;
    max-width:900px;
  }

  .sec p{
    font-size:19px;
    line-height:1.9;
    color:var(--color-text-secondary);
    max-width:900px;
    font-weight:300;
  }

  @media(max-width:900px){

    .nav{
      padding:1rem 5vw;
    }

    .nav-links{
      gap:16px;
    }

    .nav-links a{
      font-size:13px;
    }

    .hero{
      min-height:82vh;
    }

    .hero-img{
      height:82vh;
    }

    .hero-content{
      padding:0 6vw;
    }

    .slide h1{
      font-size:42px;
    }

    .slide p{
      font-size:16px;
    }

    .sec{
      padding:4rem 6vw;
    }

    .tension-grid,
    .svc-grid,
    .plans-grid{
      grid-template-columns:1fr !important;
    }
  }

</style>
